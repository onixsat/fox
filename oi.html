<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Viewer</title>

  <link
    href="https://fonts.googleapis.com/css?family=Source+Code+Pro"
    rel="stylesheet"
  />

  <style>
    .json {
      font-family: "Source Code Pro", monospace;
      font-size: 16px;
    }

    .json > .json__item {
      display: block;
    }

    .json__item {
      display: none;
      margin-top: 10px;
      padding-left: 20px;
      user-select: none;
    }

    .json__item--collapsible {
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .json__item--collapsible::before {
      content: "+";
      position: absolute;
      left: 5px;
    }

    .json__item--collapsible::after {
      background-color: lightgray;
      content: "";
      height: 100%;
      left: 9px;
      position: absolute;
      top: 26px;
      width: 1px;
    }

    .json__item--collapsible:hover > .json__key,
    .json__item--collapsible:hover > .json__value {
      text-decoration: underline;
    }

    .json__toggle {
      display: none;
    }

    .json__toggle:checked ~ .json__item {
      display: block;
    }

    .json__toggle:checked ~ .json__key::before {
      content: "-";
      position: absolute;
      left: 5px;
    }

    .json__key {
      color: darkblue;
      display: inline;
    }

    .json__key::after {
      content: ": ";
    }

    .json__value {
      display: inline;
    }

    .json__value--string {
      color: green;
    }

    .json__value--number {
      color: blue;
    }

    .json__value--boolean {
      color: red;
    }

    .json__value--null {
      color: gray;
    }

    .json__value--object,
    .json__value--array {
      color: gray;
    }
  </style>
</head>

<body>
  <div class="target"></div>

  <script>
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getValueType(value) {
      if (value === null) return "null";
      if (Array.isArray(value)) return "array";
      return typeof value;
    }

    function formatValue(value, type) {
      if (type === "string") {
        return `"${escapeHtml(value)}"`;
      }

      if (type === "null") {
        return "null";
      }

      if (type === "object") {
        return "{}";
      }

      if (type === "array") {
        return "[]";
      }

      return escapeHtml(value);
    }

    function jsonViewer(json, openByDefault = false) {
      const templates = {
        item: `
          <div class="json__item">
            <div class="json__key">%KEY%</div>
            <div class="json__value json__value--%TYPE%">%VALUE%</div>
          </div>
        `,

        itemCollapsible: `
          <label class="json__item json__item--collapsible">
            <input type="checkbox" class="json__toggle" />
            <div class="json__key">%KEY%</div>
            <div class="json__value json__value--%TYPE%">%VALUE%</div>
            %CHILDREN%
          </label>
        `,

        itemCollapsibleOpen: `
          <label class="json__item json__item--collapsible">
            <input type="checkbox" checked class="json__toggle" />
            <div class="json__key">%KEY%</div>
            <div class="json__value json__value--%TYPE%">%VALUE%</div>
            %CHILDREN%
          </label>
        `
      };

      function createItem(key, value) {
        const type = getValueType(value);

        return templates.item
          .replace("%KEY%", escapeHtml(key))
          .replace("%TYPE%", type)
          .replace("%VALUE%", formatValue(value, type));
      }

      function createCollapsibleItem(key, value, children) {
        const type = getValueType(value);
        const template = openByDefault
          ? templates.itemCollapsibleOpen
          : templates.itemCollapsible;

        return template
          .replace("%KEY%", escapeHtml(key))
          .replace("%TYPE%", type)
          .replace("%VALUE%", formatValue(value, type))
          .replace("%CHILDREN%", children);
      }

      function handleItem(key, value) {
        const type = getValueType(value);

        if (type === "object" || type === "array") {
          const children = Object.keys(value)
            .map(childKey => handleItem(childKey, value[childKey]))
            .join("");

          return createCollapsibleItem(key, value, children);
        }

        return createItem(key, value);
      }

      const content = Object.keys(json)
        .map(key => handleItem(key, json[key]))
        .join("");

      return `<div class="json">${content}</div>`;
    }

    fetch("./log.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Não foi possível carregar o arquivo log.json");
        }

        return response.json();
      })
      .then(json => {
        document.querySelector(".target").innerHTML =
          jsonViewer(json, true);
      })
      .catch(error => {
        document.querySelector(".target").textContent = error.message;
        console.error(error);
      });
  </script>
</body>
</html>
